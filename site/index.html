<!doctype html>
<html lang="zh-Hant" data-gitdocs-portal>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>docs</title>
<script>
  // Theme before first paint: 'light' / 'dark' pin the tokens; anything else follows prefers-color-scheme (app.css).
  try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }
</script>
<meta name="theme-color" content="#245c73" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#192126" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/home"><span class="logo" aria-hidden="true"></span><span class="brand-name">docs</span></a>
  <label class="proj"><span class="sr">專案</span><select id="proj" title="專案範圍"></select></label>
  <button id="nav-btn" class="icon-btn nav-btn" type="button" aria-expanded="false" aria-controls="tabs" aria-label="選單">☰</button>
  <nav class="tabs" id="tabs" aria-label="主選單">
    <a href="#/home" data-view="home">首頁</a>
    <a href="#/list" data-view="list">文件列表</a>
    <a href="#/summary" data-view="summary">摘要</a>
    <a href="#/timeline" data-view="timeline">時間軸</a>
    <a href="#/graph" data-view="graph">關聯圖</a>
  </nav>
  <div class="search">
    <label class="grow"><span class="sr">搜尋</span>
      <input id="q" type="search" placeholder="搜尋…  例：k:API cat:評估 -封存  ( / )" autocomplete="off"></label>
    <button id="qhelp" class="icon-btn" type="button" aria-expanded="false" aria-controls="helppop" title="搜尋語法">?</button>
    <div id="helppop" class="helppop" hidden></div>
  </div>
  <div class="profile">
    <button id="me-btn" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="me-menu" title="帳號與設定">訪客</button>
    <div id="me-menu" class="menu" hidden></div>
  </div>
</header>

<main id="app" tabindex="-1"><p class="loading">載入中…</p></main>

<footer class="foot">
  <div class="legends"><div class="legend" id="legend"></div><div class="legend" id="legend-sens"></div></div>
  <div class="meta"><span id="built"></span></div>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
