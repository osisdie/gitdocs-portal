name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node scripts/build.mjs
      - run: node scripts/vault.mjs check
        env:
          VAULT_PASSPHRASE: correct horse battery staple   # demo vault in examples/ only
      - run: node --check site/app.js && node --check site/vault.js && node --check site/query.js
