# CI for a content repo on GitHub (copy to .github/workflows/docs.yml). Same checks as templates/gitlab-ci.yml.
# Deploys stay manual (npm run deploy). In server mode apply D1 migrations before deploying a new engine version:
#   npx --yes wrangler@4.166.0 d1 migrations apply DB --remote      (npm run db:migrate)
name: docs
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash scripts/engine.sh check
      - run: node scripts/build.mjs --check
      - run: node scripts/vault.mjs check
